<div class="product-info-tabs">
  @for (spec of specs(); track spec.label) {
    <div class="product-info-tabs__row">
      <div class="product-info-tabs__coll product-info-tabs__coll_label">
        {{ spec.label }}
      </div>
      <div class="product-info-tabs__coll product-info-tabs__coll_value">
        {{ spec.value }}
      </div>
    </div>
  }
</div>
